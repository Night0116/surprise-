<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Одот шөнийн болзоо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a full-bleed night sky behind a low central picnic table; letters open as glass panels over it. */
:root{
  --night-0:#060818; --night-1:#0d1235; --night-2:#1b1446; --dusk:#3a2155;
  --candle:#ffc977; --flame:#ff9a3c; --rose:#ff7d9d; --paper:#fff3df; --ink:#2b1f3a;
  --glass:rgba(22,20,52,.55); --glass-line:rgba(255,238,214,.22);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Marck Script","Segoe Script",cursive;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:var(--night-0) linear-gradient(180deg,#050716 0%,#0b1033 42%,#1a1346 74%,#2f1c52 100%) fixed;
  color:var(--paper); font-family:var(--ui); overflow-x:hidden;
}
*{box-sizing:border-box}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.moon{position:fixed;top:clamp(34px,6vh,64px);right:clamp(14px,8vw,120px);width:clamp(64px,13vw,120px);aspect-ratio:1;z-index:1;pointer-events:none;animation:floaty 9s ease-in-out infinite}
.moon::before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle,rgba(255,236,190,.28),transparent 62%)}
.moon svg{position:relative;width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(255,236,190,.7))}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(150px,30vh,280px);z-index:1;pointer-events:none;display:block}
.lights{position:fixed;top:0;left:0;right:0;height:90px;z-index:1;pointer-events:none}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:9px;height:13px;margin:-2px 0 0 -4.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;animation:twinkle 3s ease-in-out infinite}

.stage{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding-block:18px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{text-align:center;margin-top:clamp(76px,14vh,110px);max-width:640px}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--candle);margin:0 0 10px;font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,6.4vw,54px);line-height:1.08;margin:0;text-wrap:balance;text-shadow:0 0 28px rgba(255,201,119,.35)}
.hint{margin:12px 0 0;font-size:14px;line-height:1.5;color:rgba(255,243,223,.78);text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);color:var(--paper);font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(10px);transition:background .2s,transform .2s}
.chip:hover{background:rgba(255,125,157,.22);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:rgba(255,201,119,.24);border-color:rgba(255,201,119,.6)}

.scene-wrap{width:100%;max-width:860px;margin-top:auto;padding-top:14px}
.scene{display:block;width:100%;height:auto;overflow:visible}
.hot{cursor:pointer;transition:transform .25s ease,filter .25s ease;transform-box:fill-box;transform-origin:50% 100%}
.hot:hover,.hot:focus-visible{transform:translateY(-6px);filter:drop-shadow(0 0 10px rgba(255,200,130,.65))}
.hot:focus-visible{outline:2px solid var(--candle);outline-offset:6px}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box}
.lbl{font-family:var(--ui);font-size:18px;fill:#ffe9c9;letter-spacing:.06em;font-weight:600}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite}
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s ease-in-out infinite}
.rec{transform-origin:350px 210px;animation:spin 3.6s linear infinite;animation-play-state:paused}
.rec.on{animation-play-state:running}
.arm{transition:transform 1.1s cubic-bezier(.3,.7,.2,1);transform-origin:446px 178px;transform:rotate(-10deg)}
.arm.on{transform:rotate(14deg)}
.note{font-family:serif;font-size:26px;fill:#ffd9a0;opacity:0;animation:noteUp 3.2s ease-out infinite}
.led{transition:fill .3s}

.dock{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 16px;margin-top:10px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px)}
.play{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:#2b0f1e;background:linear-gradient(135deg,var(--rose),#ffa27f);box-shadow:0 6px 18px rgba(255,125,157,.35);transition:transform .2s}
.play:hover{transform:translateY(-1px)}
.vol{display:flex;align-items:center;gap:8px;color:var(--paper)}
.vol input{width:104px;accent-color:var(--rose)}
.state{font-size:13px;color:rgba(255,243,223,.75)}

.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(4,5,18,.62);backdrop-filter:blur(6px);animation:fadeIn .35s ease}
.panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;border-radius:22px;padding:30px clamp(18px,4vw,34px) 24px;
  background:linear-gradient(160deg,rgba(255,243,223,.16),rgba(255,160,190,.08) 55%,rgba(120,110,255,.1));
  border:1px solid var(--glass-line);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);
  backdrop-filter:blur(22px) saturate(1.3);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.x:hover{background:rgba(255,125,157,.25)}
.kind{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--rose);font-weight:700;margin:0 0 6px;padding-right:44px}
.ltitle{font-family:var(--display);font-weight:600;font-size:clamp(28px,6vw,36px);line-height:1.1;margin:0 0 14px;text-wrap:balance}
.body{font-family:var(--hand);font-size:clamp(22px,4.6vw,27px);line-height:1.34;color:var(--paper)}
.body p{margin:0 0 .6em}
.sign{font-family:var(--hand);font-size:28px;color:var(--candle);text-align:right;margin-top:6px}
.details{display:grid;gap:6px;margin:10px 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--glass-line)}
.details div{display:grid;grid-template-columns:92px 1fr;gap:10px;font-family:var(--ui);font-size:14px;line-height:1.45}
.details dt{color:var(--candle);font-weight:700}
.details dd{margin:0;min-width:0}
.reply{margin-top:18px;padding-top:16px;border-top:1px dashed var(--glass-line);display:grid;gap:12px}
.reply label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--candle)}
.reply input[type="text"],.reply textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--glass-line);border-radius:12px;color:var(--paper);padding:12px 14px;font-family:var(--hand);font-size:22px;line-height:1.3}
.reply textarea{min-height:120px;resize:vertical}
.reply ::placeholder{color:rgba(255,243,223,.5)}
.reply input:focus,.reply textarea:focus{outline:none;border-color:var(--candle);box-shadow:0 0 0 3px rgba(255,201,119,.2)}
.send{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:14px;cursor:pointer;font-weight:700;font-size:16px;color:#2b0f1e;background:linear-gradient(135deg,var(--candle),var(--rose));box-shadow:0 8px 24px rgba(255,125,157,.35)}
.send small{font-weight:600;opacity:.7;font-size:12px}
.send[disabled]{opacity:.6;cursor:progress}
.err{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,90,90,.14);border:1px solid rgba(255,140,140,.4);color:#ffd0d0;font-size:14px;line-height:1.45}
.err button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,208,208,.5);background:transparent;color:#ffd0d0;cursor:pointer;font-size:13px;font-weight:600}
.done{text-align:center;padding:6px 0 4px}
.done h3{font-family:var(--display);font-size:32px;font-weight:600;margin:0 0 8px;animation:fadeUp .8s 1.3s both}
.done p{font-family:var(--hand);font-size:25px;line-height:1.3;margin:0 0 18px;animation:fadeUp .8s 1.5s both}
.done .send{animation:fadeUp .8s 1.7s both}
.flyer{position:relative;height:150px;display:grid;place-items:end center}
.flyer .env{animation:fly 2.2s cubic-bezier(.4,.1,.6,1) forwards}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--candle);box-shadow:0 0 10px 2px var(--candle);opacity:0;animation:spark 2.2s ease-out forwards}
.spark.s1{left:44%;bottom:30px;animation-delay:.3s}.spark.s2{left:52%;bottom:50px;animation-delay:.6s}.spark.s3{left:58%;bottom:80px;animation-delay:.9s}.spark.s4{left:40%;bottom:70px;animation-delay:1.1s}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.94,1.07) rotate(-2deg)}45%{transform:scale(1.06,.95) rotate(1.5deg)}70%{transform:scale(.97,1.04) rotate(-1deg)}}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes noteUp{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(22px,-64px);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fly{0%{transform:translate(0,30px) scale(.7) rotate(-8deg);opacity:0}15%{opacity:1}60%{transform:translate(40px,-110px) scale(1) rotate(6deg);opacity:1}100%{transform:translate(170px,-250px) scale(.25) rotate(18deg);opacity:0}}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(40px,-60px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
@media (max-width:520px){.details div{grid-template-columns:1fr;gap:2px}.dock{border-radius:24px;padding:10px 14px}}
</style>

</head>

/* ============ Дууны хөдөлгүүр (Web Audio API) ============ */
var Music = (function(){
  var ctx, master, bus, sess = null, timer = 0, nextT = 0, step = 0, vol = 0.6, running = false;
  var CHORD = 4.8;
  var PROG = [
    { pad:[48,55,59,64], arp:[72,76,79,83] },
    { pad:[45,52,60,64], arp:[69,72,76,79] },
    { pad:[41,48,57,64], arp:[65,69,72,76] },
    { pad:[43,50,59,62], arp:[67,71,74,79] }
  ];
  var SEQ = [0,1,2,3,2,1,2,1];
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function impulse(sec){
    var rate = ctx.sampleRate, len = Math.floor(rate * sec), b = ctx.createBuffer(2, len, rate);
    for (var ch = 0; ch < 2; ch++){
      var d = b.getChannelData(ch);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    return b;
  }
  function ensure(){
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain();
    var conv = ctx.createConvolver(); conv.buffer = impulse(3.4);
    var wet = ctx.createGain(); wet.gain.value = 0.6;
    bus.connect(master); bus.connect(conv); conv.connect(wet); wet.connect(master);
  }
  function pad(freq, t, dur){
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o1.type = "sine"; o2.type = "triangle"; o1.frequency.value = freq; o2.frequency.value = freq; o2.detune.value = 7;
    f.type = "lowpass"; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 1.3);
    g.gain.setValueAtTime(0.055, t + dur - 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.4);
    o1.connect(g); o2.connect(g); g.connect(f); f.connect(sess);
    o1.start(t); o2.start(t); o1.stop(t + dur + 1.5); o2.stop(t + dur + 1.5);
  }
  function pluck(freq, t, v){
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o1.type = "sine"; o2.type = "triangle"; o1.frequency.value = freq; o2.frequency.value = freq * 2;
    f.type = "lowpass"; f.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.3);
    o1.connect(g); o2.connect(g); g.connect(f); f.connect(sess);
    o1.start(t); o2.start(t); o1.stop(t + 2.4); o2.stop(t + 2.4);
  }
  function chord(t){
    var c = PROG[step % PROG.length];
    c.pad.forEach(function(m){ pad(mtof(m), t, CHORD); });
    pluck(mtof(c.pad[0] - 12), t, 0.14);
    SEQ.forEach(function(idx, i){
      var vv = 0.07 + (i % 4 === 0 ? 0.03 : 0) + Math.random() * 0.015;
      pluck(mtof(c.arp[idx]), t + i * (CHORD / 8) + (Math.random() - 0.5) * 0.02, vv);
    });
    step++;
  }
  function tick(){ while (nextT < ctx.currentTime + 1.0){ chord(nextT); nextT += CHORD; } }
  function crackle(){
    var len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() < 0.0009 ? (Math.random() * 2 - 1) * 0.9 : (Math.random() * 2 - 1) * 0.012;
    var s = ctx.createBufferSource(); s.buffer = b; s.loop = true;
    var f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 3200;
    var g = ctx.createGain(); g.gain.value = 0.35;
    s.connect(f); f.connect(g); g.connect(sess); s.start();
    return s;
  }
  function target(){ return Math.max(0.0001, vol * 0.9); }
  return {
    start: function(){
      ensure();
      if (ctx.resume) ctx.resume();
      if (running) return;
      running = true;
      sess = ctx.createGain(); sess.gain.value = 1; sess.connect(bus);
      sess._noise = crackle();
      nextT = ctx.currentTime + 0.15;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(target(), ctx.currentTime, 0.4);
      tick();
      timer = setInterval(tick, 300);
    },
    stop: function(){
      if (!running) return;
      running = false;
      clearInterval(timer);
      var old = sess, now = ctx.currentTime;
      old.gain.setTargetAtTime(0, now, 0.25);
      master.gain.setTargetAtTime(0, now, 0.3);
      setTimeout(function(){ try { old._noise.stop(); old.disconnect(); } catch (e) {} }, 1600);
    },
    setVolume: function(v){
      vol = v;
      if (ctx && running) master.gain.setTargetAtTime(target(), ctx.currentTime, 0.1);
    }
  };
})();

/* ============ Шөнийн тэнгэр (одод, гэрлийн цох, зүрх) ============ */
function Sky(){
  var ref = React.useRef(null);
  React.useEffect(function(){
    var cv = ref.current, c = cv.getContext("2d");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var w = 0, h = 0, raf = 0, stars = [], flies = [], hearts = [], shoot = null, nextShoot = performance.now() + 4000;
    function rnd(a, b){ return a + Math.random() * (b - a); }
    function newHeart(initial){
      return { x:rnd(0, w), y: initial ? rnd(0, h) : h + 20, v:rnd(.25, .6), sway:rnd(.5, 1.5), p:rnd(0, 6.28), size:rnd(5, 10), a:rnd(.25, .6) };
    }
    function init(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(w * h / 5200);
      stars = []; for (var i = 0; i < n; i++) stars.push({ x:Math.random() * w, y:Math.random() * h * .82, r:rnd(.3, 1.5), p:rnd(0, 6.28), s:rnd(.6, 2.2), tint:Math.random() < .2 ? "255,214,170" : "220,230,255" });
      flies = []; for (var j = 0; j < (reduce ? 6 : 16); j++) flies.push({ x:rnd(0, w), y:rnd(h * .45, h * .95), vx:rnd(-.15, .15), vy:rnd(-.1, .1), p:rnd(0, 6.28), s:rnd(.8, 1.8), r:rnd(1.6, 3) });
      hearts = []; if (!reduce) for (var k = 0; k < 9; k++) hearts.push(newHeart(true));
      if (reduce) frame(1000);
    }
    function heart(x, y, s){
      c.beginPath(); c.moveTo(x, y + s * .3);
      c.bezierCurveTo(x, y - s * .3, x - s, y - s * .3, x - s, y + s * .3);
      c.bezierCurveTo(x - s, y + s * .8, x, y + s * 1.1, x, y + s * 1.4);
      c.bezierCurveTo(x, y + s * 1.1, x + s, y + s * .8, x + s, y + s * .3);
      c.bezierCurveTo(x + s, y - s * .3, x, y - s * .3, x, y + s * .3);
      c.closePath(); c.fill();
    }
    function frame(now){
      var t = now / 1000, i, s, a;
      c.clearRect(0, 0, w, h);
      for (i = 0; i < stars.length; i++){
        s = stars[i];
        a = reduce ? .75 : .35 + .65 * (.5 + .5 * Math.sin(t * s.s + s.p));
        c.fillStyle = "rgba(" + s.tint + "," + a.toFixed(3) + ")";
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.2832); c.fill();
        if (s.r > 1.25){
          c.strokeStyle = "rgba(" + s.tint + "," + (a * .5).toFixed(3) + ")"; c.lineWidth = .6;
          c.beginPath(); c.moveTo(s.x - s.r * 3.2, s.y); c.lineTo(s.x + s.r * 3.2, s.y); c.moveTo(s.x, s.y - s.r * 3.2); c.lineTo(s.x, s.y + s.r * 3.2); c.stroke();
        }
      }
      for (i = 0; i < flies.length; i++){
        s = flies[i];
        if (!reduce){
          s.x += s.vx + Math.sin(t * .7 + s.p) * .2; s.y += s.vy + Math.cos(t * .6 + s.p) * .15;
          if (s.x < -10) s.x = w + 10; if (s.x > w + 10) s.x = -10;
          if (s.y < h * .3) s.y = h * .95; if (s.y > h + 10) s.y = h * .5;
        }
        a = reduce ? .8 : .3 + .7 * (.5 + .5 * Math.sin(t * s.s + s.p));
        var g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
        g.addColorStop(0, "rgba(255,236,150," + a.toFixed(3) + ")"); g.addColorStop(1, "rgba(255,236,150,0)");
        c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r * 6, 0, 6.2832); c.fill();
        c.fillStyle = "rgba(255,250,214," + a.toFixed(3) + ")"; c.beginPath(); c.arc(s.x, s.y, s.r * .6, 0, 6.2832); c.fill();
      }
      for (i = 0; i < hearts.length; i++){
        s = hearts[i];
        s.y -= s.v; s.x += Math.sin(t * s.sway + s.p) * .4;
        if (s.y < -20){ hearts[i] = newHeart(false); continue; }
        a = s.a * Math.min(1, Math.max(0, s.y / (h * .35)));
        c.fillStyle = "rgba(255,125,157," + a.toFixed(3) + ")"; heart(s.x, s.y, s.size);
      }
      if (!reduce){
        if (!shoot && now > nextShoot){
          shoot = { x:rnd(w * .3, w * .95), y:rnd(0, h * .25), vx:-(6 + rnd(0, 4)), vy:3 + rnd(0, 2), life:0 };
        }
        if (shoot){
          shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life += .018;
          var al = Math.max(0, 1 - shoot.life), tx = shoot.x - shoot.vx * 9, ty = shoot.y - shoot.vy * 9;
          var lg = c.createLinearGradient(shoot.x, shoot.y, tx, ty);
          lg.addColorStop(0, "rgba(255,255,255," + al.toFixed(3) + ")"); lg.addColorStop(1, "rgba(255,255,255,0)");
          c.strokeStyle = lg; c.lineWidth = 1.6; c.beginPath(); c.moveTo(shoot.x, shoot.y); c.lineTo(tx, ty); c.stroke();
          if (shoot.life > 1){ shoot = null; nextShoot = now + rnd(7000, 14000); }
        }
        raf = requestAnimationFrame(frame);
      }
    }
    function onResize(){ cancelAnimationFrame(raf); init(); if (!reduce) raf = requestAnimationFrame(frame); }
    init(); if (!reduce) raf = requestAnimationFrame(frame);
    window.addEventListener("resize", onResize);
    return function(){ cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); };
  }, []);
  return html`<canvas id="sky" ref=${ref} aria-hidden="true"></canvas>`;
}

function Lights(){
  var N = 15, cols = ["#ffc977", "#ff7d9d", "#ffe9b8", "#ffb199"], bulbs = [];
  for (var i = 0; i < N; i++){
    var t = (i + .5) / N, y = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * 104 + t * t * 6, col = cols[i % cols.length];

  }

}

function LetterModal(p){
  var l = p.letter;
  var st = React.useState("idle"), status = st[0], setStatus = st[1];
  var er = React.useState(""), err = er[0], setErr = er[1];
  var rp = React.useState(""), reply = rp[0], setReply = rp[1];
  var nm = React.useState(""), name = nm[0], setName = nm[1];
  var cp = React.useState(false), copied = cp[0], setCopied = cp[1];
  var closeRef = React.useRef(null), taRef = React.useRef(null);

  React.useEffect(function(){ if (closeRef.current) closeRef.current.focus(); }, []);

  async function submit(e){
    e.preventDefault();
    var form = e.currentTarget;
    setCopied(false);
    if (!reply.trim()){ setErr("Эхлээд хариугаа бичнэ үү."); return; }
    if (WEB3FORMS_ACCESS_KEY.indexOf("YOUR_") === 0){
      setErr("Web3Forms access key тохируулаагүй байна. Кодын эхэнд байгаа WEB3FORMS_ACCESS_KEY-д өөрийн түлхүүрийг тавина уу.");
      return;
    }
    setErr(""); setStatus("sending");
    try {
      var res = await fetch(WEB3FORMS_URL, { method:"POST", headers:{ Accept:"application/json" }, body:new FormData(form) });
      var data = await res.json();
      if (res.ok && data.success){ setStatus("sent"); }
      else { throw new Error(data.message || "failed"); }
    } catch (x){
      setStatus("idle");
      setErr("Илгээж чадсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу.");
    }
  }
  function copy(){
    var text = (name ? name + ": " : "") + reply;
    var fallback = function(){ if (taRef.current){ taRef.current.focus(); taRef.current.select(); } };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ setCopied(true); }).catch(fallback);
    } else fallback();
  }
  function backdrop(e){ if (e.target === e.currentTarget) p.onClose(); }

  var body = html`<div className="body">
    ${l.paras.map(function(t, i){ return html`<p key=${i}>${t}</p>`; })}
    ${l.details && html`<dl className="details">${l.details.map(function(d){ return html`<div key=${d[0]}><dt>${d[0]}</dt><dd>${d[1]}</dd></div>`; })}</dl>`}
    ${l.after && html`<p>${l.after}</p>`}
    <div className="sign">${l.sign}</div>
  </div>`;

  var sent = html`<div className="done" role="status">
    <div className="flyer">
      <svg className="env" width="96" height="64" viewBox="0 0 96 64" aria-hidden="true">
        <rect width="96" height="64" rx="5" fill="#fff3df"/>
        <path d="M0 0 L48 40 L96 0 Z" fill="#f4dcc0" stroke="rgba(90,50,30,.4)" strokeLinejoin="round"/>
        <circle cx="48" cy="40" r="10" fill="#e5496f"/>
        <path d="M48 45 C40 38 45 32 48 37 C51 32 56 38 48 45Z" fill="rgba(255,255,255,.9)"/>
      </svg>
      <span className="spark s1"></span><span className="spark s2"></span><span className="spark s3"></span><span className="spark s4"></span>
    </div>
    <h3>Хариу илгээгдлээ</h3>
    <p>Таны үгс одод дундуур аялж, миний зүрхэнд хүрэх болно.</p>
    <button type="button" className="send" onClick=${p.onClose}>Хаах</button>
  </div>`;

  var formEl = html`<form className="reply" onSubmit=${submit} noValidate>
    <input type="hidden" name="access_key" value=${WEB3FORMS_ACCESS_KEY}/>
    <input type="hidden" name="subject" value=${"Шөнийн болзооны хариу: " + l.title}/>
    <input type="hidden" name="from_name" value="Одот шөнийн болзоо"/>
    <input type="checkbox" name="botcheck" style=${{ display:"none" }} tabIndex="-1" autoComplete="off"/>
    <label htmlFor="f-msg">${l.label}</label>
    <textarea id="f-msg" name="message" ref=${taRef} value=${reply} onChange=${function(e){ setReply(e.target.value); }} placeholder=${l.placeholder}></textarea>
    <label htmlFor="f-name">Таны нэр</label>
    <input id="f-name" type="text" name="name" value=${name} onChange=${function(e){ setName(e.target.value); }} placeholder="Таны нэр" autoComplete="name"/>
    ${err && html`<div className="err" role="alert"><span>${err}</span>
      ${reply.trim() && html`<button type="button" onClick=${copy}><${Icon} name="copy" size=${15}/>${copied ? "Хуулагдлаа" : "Хариугаа хуулах"}<//>`}
    </div>`}
    <button type="submit" className="send" disabled=${status === "sending"}>
      <${Icon} name="send" size=${18}/>
      ${status === "sending" ? "Илгээж байна…" : html`<span>Хариу илгээх <small>Gmail руу</small></span>`}
    <//>
  </form>`;

  return html`<div className="veil" onMouseDown=${backdrop}>
    <div className="panel" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <button type="button" className="x" ref=${closeRef} onClick=${p.onClose} aria-label="Хаах"><${Icon} name="x" size=${18}/><//>
      <p className="kind">${l.kind}</p>
      <h2 className="ltitle" id="dlg-title">${l.title}</h2>
      ${status === "sent" ? sent : html`<${React.Fragment}>${body}${formEl}<//>`}
    </div>
  </div>`;
}

/* ============ Үндсэн апп ============ */
function App(){
  var a = React.useState(false), playing = a[0], setPlaying = a[1];
  var b = React.useState(0.6), volume = b[0], setVolume = b[1];
  var c = React.useState(null), openId = c[0], setOpenId = c[1];

  function toggle(){
    if (playing){ Music.stop(); setPlaying(false); }
    else { Music.start(); setPlaying(true); }
  }
  React.useEffect(function(){ Music.setVolume(volume); }, [volume]);
  React.useEffect(function(){ return function(){ Music.stop(); }; }, []);
  React.useEffect(function(){
    if (!openId) return;
    function onKey(e){ if (e.key === "Escape") setOpenId(null); }
    window.addEventListener("keydown", onKey);
    return function(){ window.removeEventListener("keydown", onKey); };
  }, [openId]);

  var letter = LETTERS.filter(function(x){ return x.id === openId; })[0];

  return html`<div className="app">
    <${Sky}/><${Moon}/><${Hills}/><${Lights}/>
    <main className="stage">
      <header className="head">
        <p className="eyebrow">Нууц шөнийн болзоо</p>
        <h1>Одод доорх бидний ширээ</h1>
        <p className="hint">Ширээн дээрх захидал, урилга, пянзыг товшиж нээгээрэй.</p>
        <div className="chips">
          <button type="button" className="chip" onClick=${function(){ setOpenId("love"); }}><${Icon} name="heart" size=${15}/>Захидал<//>
          <button type="button" className="chip" onClick=${function(){ setOpenId("date"); }}><${Icon} name="mail" size=${15}/>Болзооны урилга<//>
          <button type="button" className="chip" onClick=${function(){ setOpenId("wish"); }}><${Icon} name="star" size=${15}/>Одод руу бичсэн хүсэл<//>
          <button type="button" className="chip" aria-pressed=${playing} onClick=${toggle}><${Icon} name="music" size=${15}/>Пянз тоглуулагч<//>
        </div>
      </header>
      <div className="scene-wrap">
        <${Scene} playing=${playing} onToggle=${toggle} onOpen=${setOpenId}/>
        <div className="dock" role="group" aria-label="Хөгжмийн удирдлага">
          <button type="button" className="play" onClick=${toggle}>
            <${Icon} name=${playing ? "pause" : "play"} size=${16} fill="currentColor"/>${playing ? "Хөгжим зогсоох" : "Хөгжим асаах"}
          <//>
          <label className="vol" htmlFor="vol"><${Icon} name="vol" size=${18}/>
            <input id="vol" type="range" min="0" max="1" step="0.01" value=${volume} aria-label="Дууны түвшин" onChange=${function(e){ setVolume(parseFloat(e.target.value)); }}/>
          </label>
          <span className="state">${playing ? "Нам дор хөгжиж байна" : "Хөгжим зогссон"}</span>
        </div>
      </div>
    </main>
    ${letter && html`<${LetterModal} key=${letter.id} letter=${letter} onClose=${function(){ setOpenId(null); }}/>`}
  </div>`;
}

var rootEl = document.getElementById("root");
if (rootEl) ReactDOM.createRoot(rootEl).render(html`<${App}/>`);
</script>
</body>
</html>
